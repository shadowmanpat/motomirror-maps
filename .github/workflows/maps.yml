# Builds the country maps and uploads them to a release, on GitHub's machines:
# ~22 GB each time, which would take hours to upload from a home connection.
# Free for a public repo. Once a month, or with "Run workflow" for some countries.
name: Maps

on:
  schedule:
    - cron: "0 3 2 * *"
  workflow_dispatch:
    inputs:
      countries:
        description: "Country codes separated by spaces (empty = all)"
        default: ""
      latest:
        description: "Publish as latest even with only some countries (for testing)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Install pmtiles
        run: |
          mkdir -p "$HOME/bin"
          curl -sfL https://github.com/protomaps/go-pmtiles/releases/download/v1.31.2/go-pmtiles_1.31.2_Linux_x86_64.tar.gz \
            | tar xz -C "$HOME/bin" pmtiles
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Build and upload maps
        env:
          GH_TOKEN: ${{ github.token }}
          # Passed as a variable, not inside the command: whatever is typed into
          # the field must never become shell code.
          COUNTRIES: ${{ inputs.countries }}
          LATEST: ${{ inputs.latest }}
        run: |
          tag=$(date -u +%Y-%m-%d)-${{ github.run_number }}
          extra=""
          if [ "$LATEST" = "true" ]; then extra="--latest"; fi
          python3 build.py --release "$tag" $extra $COUNTRIES
